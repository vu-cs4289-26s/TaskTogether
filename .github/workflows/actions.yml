name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Health Checks
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasktogether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasktogether_test

      - name: Run database migrations
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasktogether_test

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test || echo "No tests found, skipping..."
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasktogether_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test

  frontend-checks:
    name: Frontend Health Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Run tests
        run: npm test || echo "No tests found, skipping..."

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasktogether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup backend
        working-directory: ./server
        run: |
          npm ci
          npx prisma generate
          npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasktogether_test

      - name: Start backend server
        working-directory: ./server
        run: |
          npm run build
          npm start &
          sleep 5
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasktogether_test
          JWT_SECRET: test-secret-key
          PORT: 3001
          NODE_ENV: test

      - name: Health check backend
        run: |
          curl -f http://localhost:3001/api/health || exit 1
          echo "Backend health check passed"

      - name: Database connection check
        run: |
          curl -f http://localhost:3001/api/db-check || exit 1
          echo "Database connection check passed"

      - name: Cleanup
        if: always()
        run: pkill -f "node" || true